<section class="task-panel" aria-label="Task list">
  <div class="table-header"><span></span><span>Task</span><span>Category</span><span>Priority</span><span>Due date</span><span></span></div>
  @for (task of tasks(); track task.id) {
    <div class="task-row">
      <input type="checkbox" [id]="'task-' + task.id" [checked]="task.completed" (change)="taskToggled.emit(task.id)" />
      <label [for]="'task-' + task.id" [class.completed]="task.completed">{{ task.title }}</label>
      <span class="category" [class]="'category ' + task.category.toLowerCase()">{{ task.category }}</span>
      <span class="priority"><i [class]="'dot ' + task.priority.toLowerCase()"></i>{{ task.priority }}</span>
      <span class="date">▣ {{ task.date }}</span>
      <button class="delete" type="button" (click)="taskDeleted.emit(task.id)" [attr.aria-label]="'Delete ' + task.title">×</button>
    </div>
  } @empty {
    <div class="empty-state"><span>☷</span><strong>No tasks found</strong><p>Add a task or adjust your filters to see it here.</p></div>
  }
  <div class="list-footer">Showing {{ tasks().length }} task{{ tasks().length === 1 ? '' : 's' }}</div>
</section>
