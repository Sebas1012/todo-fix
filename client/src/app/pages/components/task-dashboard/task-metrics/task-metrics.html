<div class="metric-card">
  <div><span class="metric-label">Total</span><strong>{{ total() }}</strong><small>All your tasks</small></div>
  <span class="metric-icon"><app-icon name="list" /></span>
</div>
<div class="metric-card">
  <div><span class="metric-label">Completed</span><strong>{{ completed() }}</strong><small>{{ progress() }}% completed</small></div>
  <span class="metric-icon"><app-icon name="check-circle" /></span>
</div>
<div class="metric-card">
  <div><span class="metric-label">Pending</span><strong>{{ pending() }}</strong><small>Keep going!</small></div>
  <span class="metric-icon"><app-icon name="clock" /></span>
</div>
<div class="metric-card progress-card">
  <div><span class="metric-label">Progress</span><strong>{{ progress() }}%</strong><small>Overall progress</small></div>
  <span class="progress-ring" [style.--progress.deg]="progress() * 3.6"><span></span></span>
</div>
